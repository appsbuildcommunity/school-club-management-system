name: school_clubs_management_system

services:
  db:
    image: postgres:18
    container_name: school-clubs-management-system-db
    ports:
      - '${DB_PORT}:5432'
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USER_NAME}
    volumes:
      - ~/.school_clubs_management_system_db_data/:/var/lib/postgresql/18/data/
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: school-clubs-management-system-minio-server
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_USER_NAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - ~/.school_clubs_management_system_minio_data/:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # one-shot bootstrap: creates the "back-end" S3 user from .env on every up
  minio-init:
    image: minio/minio:latest
    container_name: school-clubs-management-system-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_USER_NAME}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
      S3_BACK_END_ACCESS_KEY: ${S3_BACK_END_ACCESS_KEY}
      S3_BACK_END_SECRET_KEY: ${S3_BACK_END_SECRET_KEY}
    restart: 'no'
    entrypoint: >
      /bin/sh -c '
      mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
      mc admin user add local "$$S3_BACK_END_ACCESS_KEY" "$$S3_BACK_END_SECRET_KEY" &&
      mc admin policy attach local readwrite --user "$$S3_BACK_END_ACCESS_KEY"'
