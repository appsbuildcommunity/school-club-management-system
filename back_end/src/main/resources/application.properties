# loading the .env variables
spring.config.import=optional:file:.env[.properties]

spring.application.name=club_management_system

# database configuration
spring.datasource.url=jdbc:postgresql://${DB_URL}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER_NAME}
spring.datasource.password=${DB_PASSWORD}

# hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# liquibase config
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true

# OAuth2 social login
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth.facebook.client-id=${FACEBOOK_CLIENT_ID:}
app.oauth.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
app.oauth.facebook.graph-version=${FACEBOOK_GRAPH_VERSION:v23.0}
app.oauth.redirect-base-url=${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}

# frontend route that reads the tokens/error from the URL fragment after sign-in
app.auth.redirect-uri=${APP_AUTH_REDIRECT_URI:http://localhost:5173/auth/callback}
# comma-separated emails that receive the ADMIN role on first sign-in
app.auth.bootstrap-admin-emails=${BOOTSTRAP_ADMIN_EMAILS:}

# locally issued JWT access tokens
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.jwt.access-ttl=${JWT_ACCESS_TTL:PT1H}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:P30D}
app.jwt.issuer=${JWT_ISSUER:club-management-system}
app.jwt.audience=${JWT_AUDIENCE:club-management-system-api}

# S3 service
cloud.aws.credentials.access-key=${S3_BACK_END_ACCESS_KEY}
cloud.aws.credentials.secret-key=${S3_BACK_END_SECRET_KEY}
cloud.aws.region.static=us-east-1
cloud.aws.s3.endpoint=${S3_ENDPOINT_URL}
cloud.aws.s3.path-style-access-enabled=true
cloud.aws.s3.bucket=apps-build-school-clubs-management-system-bucket
