rules:
  - id: grantable-endpoint-without-preauthorize
    languages: [java]
    severity: ERROR
    message: >-
      $METHOD is a @Grantable endpoint but has no @PreAuthorize, so the granted
      privilege is never checked and any authenticated user can call it. Add
      @PreAuthorize("@clubAccess.hasEndpoint(#clubId, '<name>')").
    metadata:
      category: security
      cwe: 'CWE-862: Missing Authorization'
    patterns:
      - pattern: |
          @Grantable(...)
          $RET $METHOD(...) { ... }
      - pattern-not: |
          @PreAuthorize(...)
          $RET $METHOD(...) { ... }

  - id: write-endpoint-without-preauthorize
    languages: [java]
    severity: ERROR
    message: >-
      $METHOD changes data but has no @PreAuthorize, so any authenticated user
      can call it. Add the privilege check, or state the intent explicitly:
      @PreAuthorize("isAuthenticated()") for endpoints that only act on the
      caller's own data, @PreAuthorize("permitAll()") for public endpoints.
    metadata:
      category: security
      cwe: 'CWE-862: Missing Authorization'
    patterns:
      - pattern-inside: |
          @RestController
          class $CLASS { ... }
      - pattern-either:
          - pattern: |
              @PostMapping(...)
              $RET $METHOD(...) { ... }
          - pattern: |
              @PutMapping(...)
              $RET $METHOD(...) { ... }
          - pattern: |
              @PatchMapping(...)
              $RET $METHOD(...) { ... }
          - pattern: |
              @DeleteMapping(...)
              $RET $METHOD(...) { ... }
      - pattern-not: |
          @PreAuthorize(...)
          $RET $METHOD(...) { ... }

  - id: read-endpoint-without-preauthorize
    languages: [java]
    severity: WARNING
    message: >-
      $METHOD is a read endpoint without @PreAuthorize. Check that it is meant
      to be open to every authenticated user (or to everyone, if it is
      permitted in ApiSecurityConfig), and that it filters content the caller
      may not see.
    metadata:
      category: security
      cwe: 'CWE-862: Missing Authorization'
    patterns:
      - pattern-inside: |
          @RestController
          class $CLASS { ... }
      - pattern: |
          @GetMapping(...)
          $RET $METHOD(...) { ... }
      - pattern-not: |
          @PreAuthorize(...)
          $RET $METHOD(...) { ... }
